services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doomsdayvote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DOOMSDAY_OWNER_PASSWORD: ${DOOMSDAY_OWNER_PASSWORD}
      DOOMSDAY_APP_PASSWORD: ${DOOMSDAY_APP_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doomsdayvote"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: npm run migrate
    environment:
      NODE_ENV: production
      DATABASE_MIGRATION_URL: postgres://doomsday_owner:${DOOMSDAY_OWNER_PASSWORD}@db:5432/doomsdayvote
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    command: npm start
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      TRUST_PROXY: "true"
      DATABASE_URL: postgres://doomsday_app:${DOOMSDAY_APP_PASSWORD}@db:5432/doomsdayvote
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_TIME_WINDOW: 1 minute
      SECTIONS_PAGE_SIZE_DEFAULT: 50
      SECTIONS_PAGE_SIZE_MAX: 200
    depends_on:
      migrate:
        condition: service_completed_successfully
    user: node

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata:
